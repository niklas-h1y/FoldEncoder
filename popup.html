<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #0b0d10;
      color: #f4f7f2;
      margin: 0;
      padding: 16px;
      width: 200px;
      text-align: center;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #efffae;
    }
    button {
      background-color: #d7ff5f;
      color: #10150d;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #c2e650;
    }
    #status {
      font-size: 11px;
      color: #99a59f;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Fold Translator</h3>
  <button id="translate-btn">Fold This Page</button>
  <div id="status">Ready to encrypt</div>

  <script src="popup.js"></script>
</body>
</html>
